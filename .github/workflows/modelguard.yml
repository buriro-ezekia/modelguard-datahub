name: ModelGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          mkdir -p artifacts
          ruff check . --output-format=json > artifacts/ruff-report.json

      - name: Upload Ruff diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: artifacts/ruff-report.json

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: |
          cat artifacts/ruff-report.json
          exit 1

      - name: Test
        run: pytest

      - name: Verify broken demonstration
        run: |
          (
            cd demo/broken_change
            python evaluate_model.py \
              --output ../../artifacts/pre_repair_demo.json
          )
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("artifacts/pre_repair_demo.json").read_text(encoding="utf-8")
          )
          assert result["candidate"] == 0.771
          assert result["invalid_values"] > 0
          PY

      - name: Collect deterministic DataHub context
        run: |
          python -m modelguard context check --provider fixture
          python -m modelguard context collect \
            --provider fixture \
            --output artifacts/context_snapshot.json

      - name: Rank deterministic root-cause hypotheses
        run: |
          python -m modelguard diagnose \
            --evaluation examples/evaluation_failed.json \
            --context artifacts/context_snapshot.json \
            --changes examples/regression_case.json \
            --output artifacts/diagnosis_report.json \
            --markdown-output artifacts/root_cause_report.md

      - name: Verify leading diagnosis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/diagnosis_report.json").read_text(encoding="utf-8")
          )
          assert report["status"] == "ranked"
          assert report["top_hypothesis_id"] == "H001"
          assert report["hypotheses"][0]["category"] == "feature_transformation"
          assert report["hypotheses"][0]["confidence"] == "high"
          PY

      - name: Generate and validate constrained repair
        run: |
          python -m modelguard repair \
            --diagnosis artifacts/diagnosis_report.json \
            --evaluation examples/evaluation_failed.json \
            --case examples/repair_case.json \
            --workspace demo/broken_change \
            --plan-output artifacts/repair_plan.json \
            --validation-output artifacts/repair_validation.json \
            --patch-output artifacts/validated_patch.diff \
            --markdown-output artifacts/validated_repair_report.md

      - name: Verify validated repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          validation = json.loads(
              Path("artifacts/repair_validation.json").read_text(encoding="utf-8")
          )
          patch = Path("artifacts/validated_patch.diff").read_text(encoding="utf-8")
          source = Path(
              "demo/broken_change/src/features/customer_features.py"
          ).read_text(encoding="utf-8")

          assert validation["status"] == "validated"
          assert validation["patch_guard"]["approved"] is True
          assert validation["metric_restored"] is True
          assert validation["source_workspace_unchanged"] is True
          assert validation["post_repair_evaluation"]["candidate"] == 0.842
          assert validation["post_repair_evaluation"]["invalid_values"] == 0
          assert "if account_age_months <= 0:" in patch
          assert "if account_age_months <= 0:" not in source
          PY

      - name: Publish validated outcome to deterministic fixtures
        run: |
          python -m modelguard publish \
            --diagnosis artifacts/diagnosis_report.json \
            --repair-plan artifacts/repair_plan.json \
            --validation artifacts/repair_validation.json \
            --patch artifacts/validated_patch.diff \
            --github-mode fixture \
            --datahub-mode fixture \
            --github-state artifacts/github_publication_state.json \
            --datahub-state artifacts/datahub_incident_state.json \
            --apply \
            --output artifacts/publication_receipt.json \
            --markdown-output artifacts/publication_report.md \
            --comment-output artifacts/github_pr_comment.md

          python -m modelguard publish \
            --diagnosis artifacts/diagnosis_report.json \
            --repair-plan artifacts/repair_plan.json \
            --validation artifacts/repair_validation.json \
            --patch artifacts/validated_patch.diff \
            --github-mode fixture \
            --datahub-mode fixture \
            --github-state artifacts/github_publication_state.json \
            --datahub-state artifacts/datahub_incident_state.json \
            --apply \
            --output artifacts/publication_receipt_repeat.json

      - name: Verify idempotent publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          first = json.loads(
              Path("artifacts/publication_receipt.json").read_text(encoding="utf-8")
          )
          repeat = json.loads(
              Path("artifacts/publication_receipt_repeat.json").read_text(
                  encoding="utf-8"
              )
          )
          github = json.loads(
              Path("artifacts/github_publication_state.json").read_text(
                  encoding="utf-8"
              )
          )
          datahub = json.loads(
              Path("artifacts/datahub_incident_state.json").read_text(
                  encoding="utf-8"
              )
          )
          comment = Path("artifacts/github_pr_comment.md").read_text(encoding="utf-8")

          assert first["status"] == "published"
          assert [item["action"] for item in first["channels"]] == [
              "created",
              "raised_and_resolved",
          ]
          assert [item["action"] for item in repeat["channels"]] == ["noop", "noop"]
          assert len(github["comments"]) == 1
          assert len(datahub["incidents"]) == 1
          assert datahub["incidents"][0]["state"] == "RESOLVED"
          assert "modelguard:delivery" in comment
          PY

      - name: Upload ModelGuard evidence artefacts
        uses: actions/upload-artifact@v4
        with:
          name: modelguard-phase-5-publication
          path: |
            artifacts/pre_repair_demo.json
            artifacts/context_snapshot.json
            artifacts/diagnosis_report.json
            artifacts/root_cause_report.md
            artifacts/repair_plan.json
            artifacts/repair_validation.json
            artifacts/validated_patch.diff
            artifacts/validated_repair_report.md
            artifacts/publication_receipt.json
            artifacts/publication_receipt_repeat.json
            artifacts/publication_report.md
            artifacts/github_pr_comment.md
            artifacts/github_publication_state.json
            artifacts/datahub_incident_state.json

name: ModelGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          mkdir -p artifacts
          ruff check . --output-format=json > artifacts/ruff-report.json

      - name: Upload Ruff diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: artifacts/ruff-report.json

      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: |
          cat artifacts/ruff-report.json
          exit 1

      - name: Test
        run: pytest

      - name: Run complete six-phase showcase
        run: python scripts/run_showcase.py

      - name: Verify showcase result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(
              Path("artifacts/showcase/showcase_summary.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["status"] == "complete"
          assert summary["f1_before"] == 0.771
          assert summary["f1_after"] == 0.842
          assert summary["invalid_values_after"] == 0
          assert summary["top_hypothesis"] == "feature_transformation"
          assert summary["top_score"] == 1.0
          assert summary["repair_status"] == "validated"
          assert summary["patch_guard"] is True
          assert summary["source_unchanged"] is True
          assert summary["first_publication"] == {
              "github": "created",
              "datahub": "raised_and_resolved",
          }
          assert summary["repeat_publication"] == {
              "github": "noop",
              "datahub": "noop",
          }
          PY

      - name: Verify submission package
        run: python scripts/verify_submission.py

      - name: Upload complete ModelGuard evidence and submission package
        uses: actions/upload-artifact@v4
        with:
          name: modelguard-phase-6-submission
          path: |
            artifacts/showcase/
            artifacts/submission_manifest.json
            docs/assets/screenshot-overview.svg
            docs/assets/screenshot-evidence.svg
            docs/assets/screenshot-mobile.svg
            submission/

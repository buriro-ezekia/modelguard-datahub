[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelguard-datahub"
version = "0.7.0"
description = "A DataHub-grounded production ML agent that diagnoses regressions and validates constrained repairs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Buriro Ezekia" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
datahub = [
  "acryl-datahub>=1.6,<2",
]
mcp = [
  "httpx>=0.28,<1",
  "mcp>=1.24,<2",
]
phase2 = [
  "acryl-datahub>=1.6,<2",
  "httpx>=0.28,<1",
  "mcp>=1.24,<2",
]
live = [
  "acryl-datahub>=1.6,<2",
  "httpx>=0.28,<1",
  "mcp>=1.24,<2",
  "mcp-server-datahub==0.6.0",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
modelguard = "modelguard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_datahub: requires an explicitly configured live DataHub instance",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
